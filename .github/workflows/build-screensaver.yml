name: Build macOS screensaver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build web assets
        run: |
          npm ci
          npm exec -- grunt build

      - name: Build universal screen saver
        run: |
          xcodebuild -project 'Evangelion Clock.xcodeproj' \
            -scheme 'Evangelion Clock' -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=11.0 CODE_SIGNING_ALLOWED=NO build

      - name: Verify and package screen saver
        run: |
          bundle='build/Build/Products/Release/Evangelion Clock.saver'
          lipo -verify_arch arm64 x86_64 "$bundle/Contents/MacOS/Evangelion Clock"
          test -f "$bundle/Contents/Resources/Webview/style-normal-3d.html"
          codesign --sign - "$bundle"
          codesign --verify --strict "$bundle"
          ditto -c -k --keepParent "$bundle" Evangelion-Clock.saver.zip

      - uses: actions/upload-artifact@v7
        with:
          path: Evangelion-Clock.saver.zip
          archive: false
          if-no-files-found: error
